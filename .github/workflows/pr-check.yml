name: pr-check

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - milestoned
      - demilestoned
      - ready_for_review
      - converted_to_draft
      - auto_merge_enabled
      - auto_merge_disabled
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  pull-requests: read
  contents: read

# The job is short and changes nothing, so runs queue per PR instead of cancelling each other.
# With cancel-in-progress the newest run could be the cancelled one and leave the required
# check red (PR #77). Queued, the newest event always runs last and decides the result.
concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# Approval is GitHub's own review (branch protection), not a label. This check validates the
# PR's metadata and that large PRs are never queued for auto-merge. With the repo variable
# DEV_FLOW=on it also applies the dev/release rules (plan 010 C): only release/* snapshots of
# dev go to main, and a size:large PR into dev needs the user's Approve on its head. Reviews
# re-run the check, so an Approve or a dismissal updates it.

jobs:
  pr-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The default branch's rules, so a PR cannot loosen its own check. Before
      # scripts/pr-check.sh first reaches the default branch, the PR's copy is used once.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/pr-check.sh
          sparse-checkout-cone-mode: false
          path: judge
      - if: hashFiles('judge/scripts/pr-check.sh') == ''
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: scripts/pr-check.sh
          sparse-checkout-cone-mode: false
          path: judge
      - name: Validate PR body, labels, milestone, auto-merge, approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          DEV_FLOW: ${{ vars.DEV_FLOW }}
        run: |
          set -euo pipefail
          # Re-read the current PR; the event payload may be stale.
          gh api "repos/$REPO/pulls/$PR" > pr.json
          gh api --paginate "repos/$REPO/pulls/$PR/reviews?per_page=100" | jq -s 'add // []' > reviews.json
          compare=""
          if [ "${DEV_FLOW:-}" = on ] && [ "$(jq -r .base.ref pr.json)" = main ]; then
            # behind/identical: the head commit is already in dev's history.
            compare=$(gh api "repos/$REPO/compare/dev...$(jq -r .head.sha pr.json)" --jq .status 2>/dev/null || true)
          fi
          echo "DEV_FLOW=${DEV_FLOW:-} compare=${compare:-}"
          if out=$(bash judge/scripts/pr-check.sh pr.json reviews.json "${DEV_FLOW:-}" "$compare"); then
            echo "$out"
          else
            while IFS= read -r e; do echo "::error::$e"; done <<<"$out"
            exit 1
          fi
